name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  worker:
    name: Push server (Cloudflare)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "has=$([ -n "$T" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has == 'yes'
        with:
          node-version: 22
      - id: deploy
        if: steps.check.outputs.has == 'yes'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          ID=$(npx wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>/TW$/.test(x.title));console.log(n?n.id:'')}catch(e){console.log('')}})")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create TW 2>&1 | tee kv.txt
            ID=$(grep -oE '[0-9a-f]{32}' kv.txt | head -1)
          fi
          if [ -z "$ID" ]; then echo "::error::Could not create KV namespace"; exit 1; fi
          echo "KV: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
          npx wrangler deploy --var "SUBJECT:https://${{ github.repository_owner }}.github.io" | tee out.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' out.txt | head -1)
          if [ -z "$URL" ]; then echo "::error::Worker URL not found in wrangler output"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  pages:
    name: App (GitHub Pages)
    needs: worker
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the app at the push server
        run: echo "window.TW_PUSH_URL = '${{ needs.worker.outputs.url }}';" > app/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: pages
        uses: actions/deploy-pages@v4
